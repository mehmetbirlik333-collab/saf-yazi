<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saf Yazı Akışı</title>
  <style>
    :root {
      --bg-color: #0f1419;
      --card-bg: #15202b;
      --border-color: #38444d;
      --text-main: #f7f9f9;
      --text-muted: #8b98a5;
      --accent: #1d9bf0;
      --error: #f4212e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 680px; margin: 0 auto; line-height: 1.5; }
    header { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
    
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    select { flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    button:active { opacity: 0.8; }
    
    .status { font-size: 0.85rem; color: var(--text-muted); margin: 12px 0; }
    .status.error { color: var(--error); font-weight: bold; }
    
    .feed-list { display: flex; flex-direction: column; gap: 12px; }
    .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; word-break: break-word; }
    .post-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .post-text { font-size: 0.95rem; color: var(--text-main); white-space: pre-line; }
  </style>
</head>
<body>

  <header>
    <h1>Saf Yazı Akışı</h1>
    <div class="controls">
      <select id="source-select">
        <option value="cubbeli_yt">Cübbeli Ahmet Hoca (YouTube)</option>
        <option value="aa">Anadolu Ajansı (Güncel)</option>
        <option value="trt">TRT Haber (Son Dakika)</option>
        <option value="haber7">Haber 7 (Gündem)</option>
        <option value="trtarabi">TRT Arabi (عربي)</option>
        <option value="trt_spor">TRT Spor (Son Dakika)</option>
      </select>
      <button id="fetch-btn" onclick="fetchFeed()">Getir</button>
    </div>
    <div class="status" id="status-text">Kaynak seçip "Getir" butonuna basın.</div>
  </header>

  <main class="feed-list" id="feed-container"></main>

  <script>
    const SOURCES = {
      'cubbeli_yt': 'https://www.youtube.com/feeds/videos.xml?channel_id=UC43i8xG4ySsm_Xk5S9B1oag',
      'aa': 'https://www.aa.com.tr/tr/rss/default?cat=guncel',
      'trt': 'https://www.trthaber.com/sondakika.rss',
      'haber7': 'https://rss.haber7.com/rss/haber7.xml',
      'trtarabi': 'https://www.trtarabi.com/rss',
      'trt_spor': 'https://www.trtspor.com.tr/rss/'
    };

    function cleanHTML(rawHtml) {
      if (!rawHtml) return '';
      const temp = document.createElement('div');
      temp.innerHTML = rawHtml;
      const media = temp.querySelectorAll('img, video, iframe, a, style, script, figure');
      media.forEach(el => el.remove());
      return temp.innerText.trim();
    }

    async function fetchFeed() {
      const selectedKey = document.getElementById('source-select').value;
      const rssUrl = SOURCES[selectedKey];
      const statusEl = document.getElementById('status-text');
      const containerEl = document.getElementById('feed-container');
      const btn = document.getElementById('fetch-btn');

      statusEl.className = "status";
      statusEl.innerText = "Yazılar getiriliyor...";
      containerEl.innerHTML = '';
      btn.disabled = true;
      btn.style.opacity = "0.5";

      try {
        // YouTube veya Haber siteleri için CORS engelini aşan güvenli API tüneli
        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          statusEl.innerText = `${data.items.length} adet içerik yüklendi.`;
          data.items.forEach(item => {
            const title = item.title ? item.title.trim() : '';
            const desc = cleanHTML(item.description || item.content);
            
            let dateStr = '';
            if (item.pubDate) {
              const d = new Date(item.pubDate);
              if (!isNaN(d.getTime())) dateStr = d.toLocaleString('tr-TR');
            }

            renderCard(title, desc, dateStr, containerEl);
          });
        } else {
          // Eğer rss2json YouTube'u okuyamazsa alternatif doğrudan XML okuyucu devreye girer
          await fetchDirectXML(rssUrl, statusEl, containerEl);
        }
      } catch (err) {
        await fetchDirectXML(rssUrl, statusEl, containerEl);
      }

      btn.disabled = false;
      btn.style.opacity = "1";
    }

    async function fetchDirectXML(rssUrl, statusEl, containerEl) {
      try {
        const corsProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
        const res = await fetch(corsProxy);
        const json = await res.json();
        
        if (!json.contents) throw new Error("Veri alınamadı");

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(json.contents, "text/xml");

        const entries = xmlDoc.querySelectorAll("entry"); // YouTube Atom formatı
        const items = xmlDoc.querySelectorAll("item"); // Standart RSS formatı

        if (entries.length > 0) {
          statusEl.innerText = `${entries.length} adet video yüklendi.`;
          entries.forEach(entry => {
            const title = entry.querySelector("title")?.textContent || "";
            const pubDate = entry.querySelector("published")?.textContent || "";
            
            let desc = "";
            const mediaGroup = entry.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "group")[0];
            if (mediaGroup) {
              const mediaDesc = mediaGroup.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "description")[0];
              if (mediaDesc) desc = mediaDesc.textContent;
            }

            let dateStr = '';
            if (pubDate) {
              const d = new Date(pubDate);
              if (!isNaN(d.getTime())) dateStr = d.toLocaleString('tr-TR');
            }

            renderCard(title, cleanHTML(desc), dateStr, containerEl);
          });
        } else if (items.length > 0) {
          statusEl.innerText = `${items.length} adet içerik yüklendi.`;
          items.forEach(item => {
            const title = item.querySelector("title")?.textContent || "";
            const desc = item.querySelector("description")?.textContent || "";
            const pubDate = item.querySelector("pubDate")?.textContent || "";

            let dateStr = '';
            if (pubDate) {
              const d = new Date(pubDate);
              if (!isNaN(d.getTime())) dateStr = d.toLocaleString('tr-TR');
            }

            renderCard(title, cleanHTML(desc), dateStr, containerEl);
          });
        } else {
          throw new Error("Akış boş");
        }
      } catch (e) {
        statusEl.className = "status error";
        statusEl.innerText = "İçerik çekilemedi. Lütfen tekrar deneyin.";
      }
    }

    function renderCard(title, desc, dateStr, containerEl) {
      const card = document.createElement('article');
      card.className = 'post-card';
      card.innerHTML = `
        ${dateStr ? `<div class="post-date">${dateStr}</div>` : ''}
        <div class="post-text"><strong>${title}</strong>${desc ? `\n\n${desc}` : ''}</div>
      `;
      containerEl.appendChild(card);
    }

    window.onload = fetchFeed;
  </script>
</body>
</html>
