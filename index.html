<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saf Yazı Akışı</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #15202b;
      --border: #38444d;
      --text: #f7f9f9;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --error: #f4212e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 680px; margin: 0 auto; line-height: 1.5; }
    header { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; margin-bottom: 12px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    select { flex: 1; min-width: 200px; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; outline: none; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .status { font-size: 0.85rem; color: var(--muted); margin: 12px 0; }
    .status.error { color: var(--error); font-weight: bold; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; word-break: break-word; }
    .date { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .text { font-size: 0.95rem; white-space: pre-line; }
  </style>
</head>
<body>

  <header>
    <h1>Saf Yazı Akışı</h1>
    <div class="controls">
      <select id="source">
        <option value="https://www.trtrussian.com/rss">TRT Russian</option>
        <option value="https://www.trthaber.com/sondakika.rss">TRT Haber</option>
        <option value="https://www.aa.com.tr/tr/rss/default?cat=guncel">Anadolu Ajansı</option>
        <option value="https://rss.haber7.com/rss/haber7.xml">Haber 7</option>
        <option value="https://www.trtspor.com.tr/rss/">TRT Spor</option>
        <option value="https://www.youtube.com/feeds/videos.xml?channel_id=UC43i8xG4ySsm_Xk5S9B1oag">Cübbeli Ahmet Hoca (YouTube)</option>
      </select>
      <button onclick="loadFeed()">Getir</button>
    </div>
    <div id="status" class="status">Kaynak seçip Getir butonuna basın.</div>
  </header>

  <main id="feed"></main>

  <script>
    async function loadFeed() {
      const url = document.getElementById('source').value;
      const status = document.getElementById('status');
      const feed = document.getElementById('feed');

      status.className = "status";
      status.innerText = "Yükleniyor...";
      feed.innerHTML = "";

      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        if (!data.contents) throw new Error("Boş veri");

        const parser = new DOMParser();
        const xml = parser.parseFromString(data.contents, "text/xml");

        const items = xml.querySelectorAll("item, entry");

        if (items.length === 0) {
          throw new Error("İçerik bulunamadı");
        }

        status.innerText = `${items.length} içerik başarıyla yüklendi.`;

        items.forEach(el => {
          const title = el.querySelector("title")?.textContent || "";
          const desc = el.querySelector("description")?.textContent || el.getElementsByTagNameNS("*", "description")[0]?.textContent || "";
          const date = el.querySelector("pubDate, published")?.textContent || "";

          let cleanDesc = desc.replace(/<[^>]*>?/gm, '').trim();
          if (cleanDesc.length > 300) cleanDesc = cleanDesc.substring(0, 300) + "...";

          let dateStr = "";
          if (date) {
            const d = new Date(date);
            if (!isNaN(d.getTime())) dateStr = d.toLocaleString('tr-TR');
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${dateStr ? `<div class="date">${dateStr}</div>` : ''}
            <div class="text"><strong>${title.trim()}</strong>${cleanDesc ? `\n\n${cleanDesc}` : ''}</div>
          `;
          feed.appendChild(card);
        });

      } catch (err) {
        status.className = "status error";
        status.innerText = "İçerik alınamadı. Lütfen tekrar deneyin.";
      }
    }

    window.onload = loadFeed;
  </script>
</body>
</html>
