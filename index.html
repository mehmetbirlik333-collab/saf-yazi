<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saf Yazı Akışı</title>
  <style>
    :root {
      --bg-color: #0f1419;
      --card-bg: #15202b;
      --border-color: #38444d;
      --text-main: #f7f9f9;
      --text-muted: #8b98a5;
      --accent: #1d9bf0;
      --error: #f4212e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 680px; margin: 0 auto; line-height: 1.5; }
    header { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
    
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    select { flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    button:active { opacity: 0.8; }
    
    .status { font-size: 0.85rem; color: var(--text-muted); margin: 12px 0; }
    .status.error { color: var(--error); font-weight: bold; }
    
    .feed-list { display: flex; flex-direction: column; gap: 12px; }
    .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; word-break: break-word; }
    .post-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .post-text { font-size: 0.95rem; color: var(--text-main); white-space: pre-line; }
  </style>
</head>
<body>

  <header>
    <h1>Saf Yazı Akışı</h1>
    <div class="controls">
      <select id="source-select">
        <option value="aa">Anadolu Ajansı (Güncel)</option>
        <option value="trt">TRT Haber (Son Dakika)</option>
        <option value="haber7">Haber 7 (Gündem)</option>
        <option value="aljazeera">Al Jazeera (English)</option>
        <option value="trtarabic">TRT Arabi (عربي)</option>
      </select>
      <button id="fetch-btn" onclick="fetchFeed()">Getir</button>
    </div>
    <div class="status" id="status-text">Kaynak seçip "Getir" butonuna basın.</div>
  </header>

  <main class="feed-list" id="feed-container"></main>

  <script>
    const SOURCES = {
      'aa': 'https://www.aa.com.tr/tr/rss/default?cat=guncel',
      'trt': 'https://www.trthaber.com/sondakika.rss',
      'haber7': 'https://rss.haber7.com/rss/haber7.xml',
      'aljazeera': 'https://www.aljazeera.com/xml/rss/all.xml',
      'trtarabic': 'https://www.trtarabi.com/rss'
    };

    async function fetchWithTimeout(url, options = {}) {
      const { timeout = 6000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return response;
    }

    async function fetchFeed() {
      const selectedKey = document.getElementById('source-select').value;
      const rssUrl = SOURCES[selectedKey];
      const statusEl = document.getElementById('status-text');
      const containerEl = document.getElementById('feed-container');
      const btn = document.getElementById('fetch-btn');

      statusEl.className = "status";
      statusEl.innerText = "Haberler getiriliyor, lütfen bekleyin...";
      containerEl.innerHTML = '';
      btn.disabled = true;
      btn.style.opacity = "0.5";

      // Yedekli proxy yolları
      const proxies = [
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`
      ];

      let success = false;

      for (const proxyUrl of proxies) {
        if (success) break;

        try {
          const response = await fetchWithTimeout(proxyUrl, { timeout: 6000 });
          let items = [];

          if (proxyUrl.includes('rss2json')) {
            const data = await response.json();
            if (data.status === 'ok' && data.items) {
              items = data.items.map(i => ({
                title: i.title,
                desc: i.description || i.content,
                date: i.pubDate
              }));
            }
          } else {
            const xmlText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const xmlItems = xmlDoc.querySelectorAll("item");

            xmlItems.forEach(item => {
              items.push({
                title: item.querySelector("title")?.textContent || "",
                desc: item.querySelector("description")?.textContent || item.querySelector("encoded")?.textContent || "",
                date: item.querySelector("pubDate")?.textContent || ""
              });
            });
          }

          if (items.length > 0) {
            statusEl.innerText = `${items.length} adet yeni haber yüklendi.`;

            items.forEach(item => {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = item.desc || item.title;

              const mediaElements = tempDiv.querySelectorAll('img, video, iframe, a, style, script');
              mediaElements.forEach(el => el.remove());

              const cleanText = tempDiv.innerText.trim();
              const titleText = item.title ? item.title.trim() : '';
              const dateStr = item.date ? new Date(item.date).toLocaleString('tr-TR') : '';

              const card = document.createElement('article');
              card.className = 'post-card';
              card.innerHTML = `
                ${dateStr !== 'Invalid Date' && dateStr ? `<div class="post-date">${dateStr}</div>` : ''}
                <div class="post-text"><strong>${titleText}</strong>\n\n${cleanText}</div>
              `;
              containerEl.appendChild(card);
            });

            success = true;
          }
        } catch (err) {
          console.warn("Proxy denemesi başarısız, diğerine geçiliyor...");
        }
      }

      if (!success) {
        statusEl.className = "status error";
        statusEl.innerText = "Bu kaynağa erişilemedi. Sunucu yoğun olabilir, lütfen tekrar deneyin.";
      }

      btn.disabled = false;
      btn.style.opacity = "1";
    }

    window.onload = fetchFeed;
  </script>
</body>
</html>
