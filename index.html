<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saf Yazı Akışı</title>
  <style>
    body { background-color: #0f1419; color: #f7f9f9; padding: 16px; max-width: 680px; margin: 0 auto; font-family: sans-serif; }
    select, button { padding: 10px; margin-bottom: 15px; background: #15202b; color: #fff; border: 1px solid #38444d; border-radius: 8px; }
    button { background: #1d9bf0; cursor: pointer; font-weight: bold; }
    .card { background: #15202b; border: 1px solid #38444d; padding: 14px; border-radius: 10px; margin-bottom: 12px; }
    .date { font-size: 0.75rem; color: #8b98a5; margin-bottom: 6px; }
  </style>
</head>
<body>

  <h1>Saf Yazı Akışı</h1>
  
  <div>
    <select id="source">
      <option value="https://www.aa.com.tr/tr/rss/default?cat=guncel">Anadolu Ajansı</option>
      <option value="https://www.trthaber.com/sondakika.rss">TRT Haber</option>
      <option value="https://rss.haber7.com/rss/haber7.xml">Haber 7</option>
      <option value="https://www.trtspor.com.tr/rss/">TRT Spor</option>
    </select>
    <button onclick="getFeed()">Getir</button>
  </div>

  <div id="status">Kaynak seçip Getir butonuna basın.</div>
  <div id="feed"></div>

  <script>
    async function getFeed() {
      const url = document.getElementById('source').value;
      const status = document.getElementById('status');
      const feed = document.getElementById('feed');
      
      status.innerText = "Yükleniyor...";
      feed.innerHTML = "";

      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.status === 'ok') {
          status.innerText = `${data.items.length} içerik bulundu.`;
          data.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<div class="date">${item.pubDate || ''}</div><strong>${item.title}</strong><p style="margin-top:8px; font-size:0.9rem;">${item.description.replace(/<[^>]*>?/gm, '')}</p>`;
            feed.appendChild(div);
          });
        } else {
          status.innerText = "İçerik alınamadı.";
        }
      } catch (e) {
        status.innerText = "Bağlantı hatası.";
      }
    }

    window.onload = getFeed;
  </script>
</body>
</html>
